<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - Smart Canteen</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        header {
            background: #ff6600;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: white;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .cart-box {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 18px 0;
            border-bottom: 1px solid #ddd;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-size: 19px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }

        .item-price {
            color: #777;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-button {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 5px;
            background: #ff6600;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity-button:hover {
            background: #e65c00;
        }

        .quantity {
            font-size: 18px;
            font-weight: bold;
            min-width: 25px;
            text-align: center;
        }

        .item-total {
            width: 100px;
            text-align: right;
            font-size: 17px;
            font-weight: bold;
            color: #ff6600;
        }

        .remove-button {
            border: none;
            background: #cc0000;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-button:hover {
            background: #990000;
        }

        .cart-summary {
            margin-top: 25px;
            text-align: right;
        }

        .cart-summary h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .total {
            font-size: 25px;
            font-weight: bold;
            color: #ff6600;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .back-button {
            background: #333;
            color: white;
        }

        .back-button:hover {
            background: #555;
        }

        .order-button {
            background: #ff6600;
            color: white;
        }

        .order-button:hover {
            background: #e65c00;
        }

        .order-button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 20px;
        }

        .empty-cart h2 {
            color: #555;
            margin-bottom: 15px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .success-message {
            display: none;
            background: #dff5e1;
            color: #176b25;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .error-message {
            display: none;
            background: #ffe1e1;
            color: #a00000;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .cart-item {
                flex-wrap: wrap;
            }

            .item-total {
                width: auto;
            }

            .buttons {
                justify-content: center;
            }

        }

    </style>
</head>


<body>

<header>

    <h1>🛒 Smart Canteen Cart</h1>

    <p>Review your selected food items</p>

</header>


<div class="container">

    <div class="cart-box">

        <!-- SUCCESS MESSAGE -->

        <div
            id="successMessage"
            class="success-message"
        ></div>


        <!-- ERROR MESSAGE -->

        <div
            id="errorMessage"
            class="error-message"
        ></div>


        <!-- CART ITEMS -->

        <div id="cartItems"></div>


        <!-- CART SUMMARY -->

        <div
            id="cartSummary"
            class="cart-summary"
        >

            <h2>Order Summary</h2>

            <div class="total">

                Total: ₹<span id="cartTotal">0.00</span>

            </div>


            <div class="buttons">

                <a
                    href="{{ url_for('menu') }}"
                    class="button back-button"
                >
                    ← Back to Menu
                </a>


                <button
                    type="button"
                    id="placeOrderButton"
                    class="button order-button"
                    onclick="placeOrder()"
                >
                    🍽 Place Order
                </button>

            </div>

        </div>

    </div>

</div>


<script>

    // ========================================================
    // GET CART
    // ========================================================

    function getCart() {

        const savedCart =
            localStorage.getItem(
                "smartCanteenCart"
            );

        if (savedCart) {

            try {

                return JSON.parse(savedCart);

            } catch (error) {

                return [];

            }

        }

        return [];

    }


    // ========================================================
    // SAVE CART
    // ========================================================

    function saveCart(cart) {

        localStorage.setItem(
            "smartCanteenCart",
            JSON.stringify(cart)
        );

    }


    // ========================================================
    // DISPLAY CART
    // ========================================================

    function displayCart() {

        const cart = getCart();

        const cartItems =
            document.getElementById(
                "cartItems"
            );

        const cartSummary =
            document.getElementById(
                "cartSummary"
            );

        const cartTotal =
            document.getElementById(
                "cartTotal"
            );


        if (cart.length === 0) {

            cartItems.innerHTML = `

                <div class="empty-cart">

                    <h2>🛒 Your Cart is Empty</h2>

                    <p>
                        Please add some food items from the menu.
                    </p>

                    <a
                        href="{{ url_for('menu') }}"
                        class="button order-button"
                    >
                        View Menu
                    </a>

                </div>

            `;

            cartSummary.style.display = "none";

            return;

        }


        cartSummary.style.display = "block";


        let html = "";

        let total = 0;


        cart.forEach(
            function(item, index) {

                const itemTotal =
                    Number(item.price) *
                    Number(item.quantity);


                total += itemTotal;


                html += `

                    <div class="cart-item">

                        <div class="item-info">

                            <div class="item-name">

                                ${item.name}

                            </div>


                            <div class="item-price">

                                ₹${Number(
                                    item.price
                                ).toFixed(2)}

                                each

                            </div>

                        </div>


                        <div class="quantity-controls">

                            <button
                                class="quantity-button"
                                onclick="decreaseQuantity(${index})"
                            >
                                −
                            </button>


                            <span class="quantity">

                                ${item.quantity}

                            </span>


                            <button
                                class="quantity-button"
                                onclick="increaseQuantity(${index})"
                            >
                                +
                            </button>

                        </div>


                        <div class="item-total">

                            ₹${itemTotal.toFixed(2)}

                        </div>


                        <button
                            class="remove-button"
                            onclick="removeItem(${index})"
                        >
                            Remove
                        </button>

                    </div>

                `;

            }
        );


        cartItems.innerHTML = html;


        cartTotal.textContent =
            total.toFixed(2);

    }


    // ========================================================
    // INCREASE QUANTITY
    // ========================================================

    function increaseQuantity(index) {

        const cart = getCart();


        cart[index].quantity += 1;


        saveCart(cart);


        displayCart();

    }


    // ========================================================
    // DECREASE QUANTITY
    // ========================================================

    function decreaseQuantity(index) {

        const cart = getCart();


        if (cart[index].quantity > 1) {

            cart[index].quantity -= 1;

        } else {

            cart.splice(index, 1);

        }


        saveCart(cart);


        displayCart();

    }


    // ========================================================
    // REMOVE ITEM
    // ========================================================

    function removeItem(index) {

        const cart = getCart();


        if (
            !confirm(
                "Remove this item from your cart?"
            )
        ) {

            return;

        }


        cart.splice(index, 1);


        saveCart(cart);


        displayCart();

    }


    // ========================================================
    // PLACE ORDER
    // ========================================================

    async function placeOrder() {

        const cart = getCart();


        if (cart.length === 0) {

            alert(
                "Your cart is empty."
            );

            return;

        }


        // Calculate total

        let total = 0;


        cart.forEach(
            function(item) {

                total +=
                    Number(item.price) *
                    Number(item.quantity);

            }
        );


        // Confirm order

        const confirmation =
            confirm(
                "Confirm your order?\n\n" +
                "Total Amount: ₹" +
                total.toFixed(2)
            );


        if (!confirmation) {

            return;

        }


        const button =
            document.getElementById(
                "placeOrderButton"
            );


        const successMessage =
            document.getElementById(
                "successMessage"
            );


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        // Disable button

        button.disabled = true;

        button.textContent =
            "⏳ Placing Order...";


        successMessage.style.display =
            "none";

        errorMessage.style.display =
            "none";


        try {

            // Send cart to Flask

            const response =
                await fetch(
                    "{{ url_for('place_order') }}",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            cart: cart
                        })
                    }
                );


            const result =
                await response.json();


            if (result.success) {

                // Clear cart

                localStorage.removeItem(
                    "smartCanteenCart"
                );


                successMessage.innerHTML =
                    "✅ " +
                    result.message +
                    "<br><br>" +
                    "Order ID: #" +
                    result.order_id;


                successMessage.style.display =
                    "block";


                // Hide summary

                document.getElementById(
                    "cartSummary"
                ).style.display = "none";


                // Show empty cart area

                document.getElementById(
                    "cartItems"
                ).innerHTML = `

                    <div class="empty-cart">

                        <h2>
                            🎉 Order Placed Successfully!
                        </h2>

                        <p>
                            Your order has been added
                            to the Pending queue.
                        </p>

                        <a
                            href="{{ url_for('menu') }}"
                            class="button order-button"
                        >
                            Continue Ordering
                        </a>

                    </div>

                `;

            } else {

                throw new Error(
                    result.message ||
                    "Order could not be placed."
                );

            }

        } catch (error) {

            console.error(error);


            errorMessage.innerHTML =
                "❌ " +
                (
                    error.message ||
                    "Something went wrong. Please try again."
                );


            errorMessage.style.display =
                "block";


            button.disabled = false;

            button.textContent =
                "🍽 Place Order";

        }

    }


    // ========================================================
    // LOAD CART
    // ========================================================

    displayCart();

</script>

</body>

</html>
