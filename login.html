<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Canteen</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Full-screen blurred college background */
        body::before {
            content: "";
            position: fixed;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;

            background-image:
                url("{{ url_for('static', filename='images/logo.jpeg') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            filter: blur(5px);
            transform: scale(1.05);

            z-index: -2;
        }

        /* Dark transparent overlay */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: -1;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.96);
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* College symbol */
        .logo {
            width: 140px;
            max-height: 140px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h1 {
            color: #ff6600;
            margin-bottom: 10px;
        }

        p {
            color: gray;
            margin-bottom: 20px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #ff6600;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #ff6600;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #e65c00;
        }

        .error {
            background: #ffe5e5;
            color: #cc0000;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-decoration: none;
            color: #ff6600;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .login-box {
                width: 90%;
                padding: 25px;
            }

            .logo {
                width: 110px;
            }
        }
    </style>
</head>

<body>

<div class="login-box">

    <!-- College Symbol -->
    <img
        src="{{ url_for('static', filename='images/mvgr-logo.png') }}"
        alt="College Logo"
        class="logo"
    >

    <h1>Smart Canteen</h1>
    <p>Login to Continue</p>

    <!-- Show Login Error -->
    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <!-- Database Login Form -->
    <form method="POST" action="{{ url_for('login') }}">

        <input
            type="text"
            name="college_id"
            placeholder="College ID / Admin ID"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <select name="user_type" required>
            <option value="">Select User</option>
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="admin">Admin</option>
        </select>

        <button type="submit">
            Login
        </button>

    </form>

    <a href="{{ url_for('home') }}" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
